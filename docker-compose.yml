# Only source files are mounted from the host. node_modules always comes from the image, so a
# rebuild (`docker compose up --build`) is all it takes after dependencies change.
services:
  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: npm run dev -w @simata/api
    environment:
      PORT: 3001
      DATA_DIR: /data
      AUTH_PEPPER: ${AUTH_PEPPER:-dev-pepper-change-me}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin}
    ports: ["${API_PORT:-3001}:3001"]
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/migrations:/app/apps/api/migrations
      - ./packages/core/src:/app/packages/core/src
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: { context: ., dockerfile: docker/Dockerfile }
    command: npm run dev -w @simata/web
    environment:
      API_URL: http://api:3001
      # File events don't cross the Windows/Docker boundary reliably; poll instead.
      WATCH_POLL: "1"
    ports: ["${WEB_PORT:-5173}:5173"]
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./packages/core/src:/app/packages/core/src
    depends_on:
      api: { condition: service_healthy }
